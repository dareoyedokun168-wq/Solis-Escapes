<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solis Escape</title>
    <script src="tailwind.js"></script>
    <script src="icons/all.min.js"></script>
    <link rel="stylesheet" href="icons/all.min.css" />

    <style>
      
    </style>
  </head>
  <body>
    <header
      class="h-screen bg-[url('img/sea.jpeg')] bg-cover bg-center font-serif"
    >
      <div
        class="text-white flex justify-between bg-[transparent] items-center shadow backdrop-blur-lg p-5"
      >
        <div class="font-medium pl-[60px]">
          <h1 class="text-3xl uppercase">
            <a href="#">Solis</a>
          </h1>

          <h1 class="font-sans uppercase">
            <a href="#"> Escapes</a>
          </h1>
        </div>

        <div class="flex items-center">
          <nav>
            <ul
              class="flex gap-4 text-base font-semibold justify-center font-sans"
            >
              <li>
                <a href="#" class="hover:text-[#ff00008e] transition-colors"
                  >Destinations</a
                >
              </li>
              <li>
                <a href="#" class="hover:text-[#ff00008e] transition-colors"
                  >Trips</a
                >
              </li>
              <li>
                <a href="#" class="hover:text-[#ff00008e] transition-colors"
                  >Deals</a
                >
              </li>
              <li>
                <a href="#" class="hover:text-[#ff00008e] transition-colors"
                  >Blog</a
                >
              </li>
            </ul>
          </nav>
        </div>

        <div class="flex gap-4 items-center pr-3 font-sans">
          <button
            class="bg-[#0a0a50ad] shadow-sm rounded-xl px-[18px] py-[9px] font-bold text-sm border border-[#ffffff4b] cursor-pointer hover:bg-[#0b0b2cc0] transition-all ease-in"
          >
            Book Now
          </button>
          <i class="far fa-heart text-black bg-white rounded-full p-[10px]"></i>
        </div>
      </div>

      <div
        class="justify-center flex-col flex pt-[170px] items-center text-white space-y-4"
      >
        <p
          class="rounded-full px-4 py-1 shadow-sm border backdrop-blur-xl font-bold text-sm"
        >
          TAILOR-MADE JOURNEYS & COASTAL SANCTUARIES
        </p>
        <h1 class="text-7xl font-semibold">Your Next Adventure Awaits</h1>

        <div
          class="rounded-2xl p-5 border shadow-sm font-sans font-semibold backdrop-blur-md"
        >
          <h1 class="text-left text-lg text-black py-[20px]">
            Find your Escape
          </h1>
          <div
            class="bg-white space-x-5 text-black flex rounded-2xl px-[30px]  py-[15px]"
          >
            <div
              class="pr-[130px]  flex pl-[20px] items-center gap-5 hover:bg-[#a09d9d2f] transition-colors border-r-2 rounded-2xl border-[#0000005d]"
            >
          
              <div
                class="text-[#0000ff9f]  [text-3xl bg-[#e6e3e3]  rounded-full p-[20px]"
              >
                <i class="fa fa-map-location-dot"></i>
              </div>
              <div>
                <p class="text-xs text-[#00000073] font-bold">WHERE TO?</p>
                <h1 class="text-[#000000e0]">Kyoto,Japan</h1>
              </div>
            </div>
            <div
              class="border-r-2 rounded-2xl border-[#00000067] hover:bg-[#a09d9d2f] transition-colors flex items-center pl-[20px] pr-[130px] gap-3"
            >
              <div
                class="rounded-full bg-[#e6e3e3] p-[20px] text-2xl text-[#0000ff69]"
              >
                <i class="far fa-calendar"></i>
              </div>
              <div>
                <p class="text-xs text-[#00000048] font-bold">DATE RANGE</p>
                <h1 class="text-[#000000e0]">May 15 - May 24</h1>
              </div>
            </div>
            <div class="flex items-center  hover:bg-[#a09d9d2f] transition-colors rounded-2xl gap-5 pl-[20px]">
              <div class="text-2xl bg-[#e6e3e3] p-[20px] rounded-full">
                <i class="fa fa-user-alt"></i>
              </div>
              <div>
                <p class="text-xs text-[#0000006b] font-bold">TRAVELERS</p>
                <h1 class="text-[#000000e0]">2 Adults 1 Child</h1>
              </div>
              <button
                class="text-white text-2xl bg-[#ce1111be] rounded-full p-[20px]"
              >
                <i class="fa fa-search"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="bg-[whitesmoke]">
      <section class="">
      <div class="">
        <p class="">
          curated Escapes 
        </p>
        <h1 class="font-serif">
          Trending Destinations
        </h1>
      </div>
      </section>
    </main>
  </body>
</html>
